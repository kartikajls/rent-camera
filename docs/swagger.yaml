      summary: Get All Payments
      tags:
      - Admin - Payment Approve
  /admin/payments/{payment_id}/status:
    put:
      consumes:
      - application/json
      description: Admin menyetujui pembayaran rental order
      parameters:
      - description: Payment ID
        format: int64
        in: path
        name: payment_id
        required: true
        type: integer
      - description: Payment Status Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/p2-ip-kartikajls_internal_dto.UpdatePaymentStatusRequest'
      produces:
