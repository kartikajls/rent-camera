        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/p2-ip-kartikajls_internal_helper.Response'
      security:
      - BearerAuth: []
      summary: Approve Rental Order
      tags:
      - Admin - Order Approve
  /admin/payments:
