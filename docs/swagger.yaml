basePath: /
definitions:
  p2-ip-kartikajls_internal_dto.CreatePaymentRequest:
    properties:
      payment_method:
        type: string
      rental_order_id:
        type: integer
    required:
    - payment_method
    - rental_order_id
    type: object
  p2-ip-kartikajls_internal_dto.CreateRentalOrderRequest:
    properties:
      camera_id:
        type: integer
    required:
    - camera_id
    type: object
  p2-ip-kartikajls_internal_dto.CreateTopUpRequest:
    properties:
      amount:
        type: number
    type: object
  p2-ip-kartikajls_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  p2-ip-kartikajls_internal_dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  p2-ip-kartikajls_internal_dto.UpdatePaymentStatusRequest:
    properties:
      payment_status:
        type: string
    required:
    - payment_status
    type: object
  p2-ip-kartikajls_internal_dto.UpdateRentalOrderStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  p2-ip-kartikajls_internal_helper.Response:
    properties:
      responseCode:
        type: integer
      responseData: {}
      responseMessage:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API untuk aplikasi Rent Camera.
    API ini menyediakan fitur register, login, camera, top up, rental order, dan payment.
    Admin dapat melakukan approval terhadap top up, order, dan payment.
  title: Jati Rent Camera API
  version: "1.0"
paths:
  /admin/orders:
    get:
      description: Admin melihat seluruh rental order
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/p2-ip-kartikajls_internal_helper.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/p2-ip-kartikajls_internal_helper.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/p2-ip-kartikajls_internal_helper.Response'
      security:
      - BearerAuth: []
      summary: Get All Orders
      tags:
      - Admin - Order Approve
  /admin/orders/{id}/status:
    put:
      consumes:
      - application/json
      description: Admin menyetujui atau mengubah status rental order user
      parameters:
      - description: Rental Order ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Order Status Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/p2-ip-kartikajls_internal_dto.UpdateRentalOrderStatusRequest'
      produces:
